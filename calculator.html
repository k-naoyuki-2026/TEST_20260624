<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電卓</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
    }

    .calculator {
      background: #16213e;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      width: 320px;
    }

    .display {
      background: #0f3460;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .display .expression {
      color: #a0aec0;
      font-size: 14px;
      min-height: 20px;
      word-break: break-all;
    }

    .display .result {
      color: #e2e8f0;
      font-size: 36px;
      font-weight: 300;
      word-break: break-all;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      font-weight: 500;
    }

    button:active {
      transform: scale(0.93);
      opacity: 0.8;
    }

    .btn-number {
      background: #1a1a2e;
      color: #e2e8f0;
    }

    .btn-number:hover {
      background: #2d2d4e;
    }

    .btn-operator {
      background: #533483;
      color: #e2e8f0;
    }

    .btn-operator:hover {
      background: #6b44a8;
    }

    .btn-equals {
      background: #e94560;
      color: white;
    }

    .btn-equals:hover {
      background: #ff5a7a;
    }

    .btn-clear {
      background: #0f3460;
      color: #fc8181;
    }

    .btn-clear:hover {
      background: #1a4a80;
    }

    .btn-special {
      background: #0f3460;
      color: #90cdf4;
    }

    .btn-special:hover {
      background: #1a4a80;
    }

    .span-two {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">AC</button>
      <button class="btn-special" onclick="toggleSign()">+/-</button>
      <button class="btn-special" onclick="percent()">%</button>
      <button class="btn-operator" onclick="setOperator('/')">÷</button>

      <button class="btn-number" onclick="appendNumber('7')">7</button>
      <button class="btn-number" onclick="appendNumber('8')">8</button>
      <button class="btn-number" onclick="appendNumber('9')">9</button>
      <button class="btn-operator" onclick="setOperator('*')">×</button>

      <button class="btn-number" onclick="appendNumber('4')">4</button>
      <button class="btn-number" onclick="appendNumber('5')">5</button>
      <button class="btn-number" onclick="appendNumber('6')">6</button>
      <button class="btn-operator" onclick="setOperator('-')">−</button>

      <button class="btn-number" onclick="appendNumber('1')">1</button>
      <button class="btn-number" onclick="appendNumber('2')">2</button>
      <button class="btn-number" onclick="appendNumber('3')">3</button>
      <button class="btn-operator" onclick="setOperator('+')">+</button>

      <button class="btn-number span-two" onclick="appendNumber('0')">0</button>
      <button class="btn-number" onclick="appendDecimal()">.</button>
      <button class="btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let previousInput = '';
    let operator = null;
    let shouldReset = false;

    const resultEl = document.getElementById('result');
    const expressionEl = document.getElementById('expression');

    function updateDisplay() {
      resultEl.textContent = currentInput;
    }

    function appendNumber(num) {
      if (shouldReset) {
        currentInput = num;
        shouldReset = false;
      } else {
        currentInput = currentInput === '0' ? num : currentInput + num;
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (shouldReset) {
        currentInput = '0.';
        shouldReset = false;
        updateDisplay();
        return;
      }
      if (!currentInput.includes('.')) {
        currentInput += '.';
        updateDisplay();
      }
    }

    function setOperator(op) {
      if (operator && !shouldReset) {
        calculate(true);
      }
      previousInput = currentInput;
      operator = op;
      shouldReset = true;

      const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      expressionEl.textContent = `${previousInput} ${opSymbols[op]}`;
    }

    function calculate(intermediate = false) {
      if (!operator || !previousInput) return;

      const prev = parseFloat(previousInput);
      const curr = parseFloat(currentInput);
      const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

      let result;
      switch (operator) {
        case '+': result = prev + curr; break;
        case '-': result = prev - curr; break;
        case '*': result = prev * curr; break;
        case '/':
          if (curr === 0) {
            currentInput = 'エラー';
            operator = null;
            expressionEl.textContent = '';
            updateDisplay();
            return;
          }
          result = prev / curr;
          break;
      }

      if (!intermediate) {
        expressionEl.textContent = `${previousInput} ${opSymbols[operator]} ${currentInput} =`;
        operator = null;
      }

      currentInput = parseFloat(result.toFixed(10)).toString();
      shouldReset = !intermediate;
      updateDisplay();

      if (!intermediate) {
        previousInput = '';
      } else {
        previousInput = currentInput;
      }
    }

    function clearAll() {
      currentInput = '0';
      previousInput = '';
      operator = null;
      shouldReset = false;
      expressionEl.textContent = '';
      updateDisplay();
    }

    function toggleSign() {
      if (currentInput === '0' || currentInput === 'エラー') return;
      currentInput = currentInput.startsWith('-')
        ? currentInput.slice(1)
        : '-' + currentInput;
      updateDisplay();
    }

    function percent() {
      const val = parseFloat(currentInput);
      if (isNaN(val)) return;
      currentInput = (val / 100).toString();
      updateDisplay();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
      else if (e.key === '.') appendDecimal();
      else if (e.key === '+') setOperator('+');
      else if (e.key === '-') setOperator('-');
      else if (e.key === '*') setOperator('*');
      else if (e.key === '/') { e.preventDefault(); setOperator('/'); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape') clearAll();
      else if (e.key === 'Backspace') {
        if (currentInput.length > 1 && currentInput !== 'エラー') {
          currentInput = currentInput.slice(0, -1);
        } else {
          currentInput = '0';
        }
        updateDisplay();
      }
    });
  </script>
</body>
</html>
